<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">

    <div class="bg-white max-w-md mx-auto rounded-lg">

        <div class="bg-indigo-500 text-white p-5">
            <h1>Todo App</h1>
        </div>

        <div class="p-5">
            <form id="todo-form" action="" class="flex gap-5">
                <input id="todo-input" placeholder="Enter task description..." class="border flex-1 border-black p-2" type="text">
                <button id="form-btn" class="px-5 py-3 text-white bg-violet-700">Add</button>
            </form>

            <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black">
                <p id="task-count">TASKS (0)</p>
                <p id="complete-count">COMPLETED : 0</p>
            </div>
            <ul class="py-5 flex flex-col gap-3" id="todo-list">
                <!-- Todo Template -->
                <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl">
                    <input type="checkbox">
                    <p class="flex-1">Test Todo</p>
                    <div class="flex gap-2">
                        <button>Edit</button>
                        <buttone">Delete</button>
                    </div>
                </li> -->
            </ul>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
