<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">

        <div class="bg-indigo-600 px-6 py-5 text-white">
            <h1 class="text-2xl font-bold tracking-wide">Todo App</h1>
        </div>

        <div class="p-5">
            <form id="todo-form" action="" class="flex flex-col mb-6">
                <div class="flex gap-5 mb-1">
                    <input id="todo-input" placeholder="Enter task description..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800" type="text">
                    <button id="form-btn" class="px-5 py-2 bg-indigo-600 hover:bg-purple-700 text-white font-medium rounded-lg transition-colors cursor-pointer">Add</button>
                </div>
                <button type="button" id="cancel-btn"
                    class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer">
                    Cancel Editing
                </button>
            </form>

            <div class="flex items-center justify-between py-2 border-b border-slate-100 mb-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <p id="task-count">TASKS (0)</p>
                <p id="complete-count">COMPLETED : 0</p>
            </div>

            <ul class="py-5 flex flex-col gap-3" id="todo-list">
                <!-- Todo Template -->
                <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl">
                    <input type="checkbox">
                    <p class="flex-1">Test Todo</p>
                    <div class="flex gap-2">
                        <button>Edit</button>
                        <buttone">Delete</button>
                    </div>
                </li> -->
            </ul>
            <div id="empty-message" class="hidden text-center pb-8 text-slate-400">
                <p class="text-sm">No tasks found. Add a task above to get started!</p>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
